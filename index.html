<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Doceria - Vendas de Doces e Sobremesas</title>
<style>
:root{--bg:#fff;--bg2:#fff0f7;--card:#fff;--txt:#2b1520;--mut:#6a4a58;--pink:#d6106f;--pink2:#ff4fa3;--onp:#fff;--line:#f1c2da;--ok:#0a7a3d;--bad:#b3261e;--sh:0 4px 14px rgba(214,16,111,.12)}
:root[data-theme=dark]{--bg:#141414;--bg2:#1c1c1c;--card:#1f1f1f;--txt:#f7ecf1;--mut:#cfb0be;--pink:#ff4fa3;--pink2:#ff8cc4;--onp:#1a0912;--line:#3b2a33;--ok:#5fd68f;--bad:#ff8a80;--sh:none}
*{box-sizing:border-box}
html{font-size:16px}
body{margin:0;height:100vh;height:100dvh;display:flex;flex-direction:column;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;overflow:hidden}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--pink2);outline-offset:2px}
.skip{position:absolute;left:-999px;top:0;background:var(--pink);color:var(--onp);padding:10px;z-index:100}
.skip:focus{left:8px;top:8px}
h1,h2,h3{margin:0}
.mut{color:var(--mut)}
#stage{flex:1;min-height:0;position:relative;display:flex;flex-direction:column}
/* tema */
#btnTema{position:fixed;top:10px;right:10px;width:34px;height:34px;padding:0;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--pink);display:grid;place-items:center;cursor:pointer;z-index:60}
#btnTema svg{width:18px;height:18px}
/* login */
#login{flex:1;display:grid;place-items:center;padding:12px;overflow:hidden}
.lc{width:min(380px,100%);background:var(--card);border:1px solid var(--line);border-radius:20px;padding:clamp(12px,3vh,24px);box-shadow:var(--sh);text-align:center}
.lc svg.logo{width:clamp(40px,8vh,60px);height:clamp(40px,8vh,60px);color:var(--pink)}
.lc h1{font-size:clamp(1.2rem,3.4vh,1.6rem);color:var(--pink);margin:4px 0}
.lc p{margin:0 0 clamp(6px,1.5vh,12px);font-size:.9rem}
.lc .fld{text-align:left;margin-bottom:clamp(6px,1.4vh,10px)}
.lc .btn{width:100%}
.lc .link{background:none;border:0;color:var(--pink);text-decoration:underline;cursor:pointer;margin-top:6px;font:inherit;min-height:36px}
.err{color:var(--bad);font-size:.85rem;min-height:1.1em;margin:0 0 4px}
@media (max-height:520px){.lc svg.logo{display:none}.lc p{display:none}}
/* app */
#app{flex:1;min-height:0;display:flex;flex-direction:column}
header.top{height:56px;flex:none;display:flex;align-items:center;gap:10px;padding:0 54px 0 8px;background:var(--bg2);border-bottom:1px solid var(--line)}
header.top h1{font-size:1.15rem;color:var(--pink)}
.ib{width:44px;height:44px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--pink);display:grid;place-items:center;cursor:pointer;padding:0}
.ib svg{width:22px;height:22px}
#main{flex:1;min-height:0;overflow-y:auto;padding:14px;scroll-behavior:smooth}
#drawer{position:fixed;top:0;left:0;height:100vh;height:100dvh;width:min(300px,86vw);background:var(--card);border-right:1px solid var(--line);z-index:40;transform:translateX(-102%);visibility:hidden;transition:transform .25s,visibility .25s;display:flex;flex-direction:column;box-shadow:var(--sh)}
#drawer.open{transform:none;visibility:visible}
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:30}
.dh{padding:14px;background:var(--pink);color:var(--onp);display:flex;justify-content:space-between;align-items:center;gap:8px}
.dh b{font-size:1.05rem}.dh small{display:block;opacity:.9}
.dh button{background:transparent;border:1px solid currentColor;color:inherit;border-radius:10px;width:40px;height:40px;cursor:pointer;font-size:1.1rem}
#drawer nav{padding:8px;overflow-y:auto;flex:1}
#drawer nav button{display:flex;gap:10px;align-items:center;width:100%;min-height:48px;padding:0 12px;border:0;border-radius:12px;background:transparent;color:var(--txt);font:inherit;font-size:1rem;cursor:pointer;text-align:left}
#drawer nav button:hover{background:var(--bg2)}
#drawer nav button[aria-current=page]{background:var(--pink);color:var(--onp);font-weight:700}
/* ui */
.btn{min-height:44px;padding:0 16px;border-radius:12px;border:1.5px solid var(--pink);background:transparent;color:var(--pink);font:600 .95rem inherit;cursor:pointer}
.btn.pri{background:var(--pink);color:var(--onp)}
.btn.sm{min-height:36px;padding:0 10px;font-size:.82rem}
.btn.dan{border-color:var(--bad);color:var(--bad)}
.btn:hover{filter:brightness(1.07)}
input,select,textarea{width:100%;min-height:44px;padding:8px 10px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--txt);font:inherit}
textarea{min-height:70px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.fld label{display:block;font-size:.85rem;font-weight:600;margin-bottom:3px;color:var(--mut)}
.fld.full{grid-column:1/-1}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.bar h2{color:var(--pink);font-size:1.3rem}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tools input{width:200px}
.tw{overflow-x:auto;margin-top:10px}
table.t{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:12px}
.t th,.t td{padding:8px;text-align:left;border-bottom:1px solid var(--line);font-size:.9rem;vertical-align:middle}
.t th{background:var(--bg2);color:var(--pink);white-space:nowrap}
.t td.ac{white-space:nowrap}.t td.ac .btn{margin:2px}
.empty{padding:24px;text-align:center;color:var(--mut);border:1px dashed var(--line);border-radius:12px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:10px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:var(--sh)}
.card span{font-size:.8rem;color:var(--mut)}.card b{display:block;font-size:1.2rem}
.pos{color:var(--ok)}.neg{color:var(--bad)}
.sec{margin:16px 0;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--card)}
.sec h3{color:var(--pink);margin-bottom:8px;font-size:1.05rem}
.badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:.78rem;border:1px solid var(--pink);color:var(--pink)}
/* dialogs */
dialog{border:1px solid var(--line);border-radius:16px;padding:0;background:var(--card);color:var(--txt);width:min(720px,96vw);max-height:92vh;max-height:92dvh;overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.55)}
.frm{padding:16px}
.frm h2{color:var(--pink);margin-bottom:10px;font-size:1.2rem}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.resumo{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:10px;display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:6px;font-size:.9rem}
.resumo b{display:block}
.inl{display:flex;gap:8px;align-items:end;flex-wrap:wrap;margin:8px 0}
.inl .fld{flex:1;min-width:140px}
/* footer */
footer.foot{flex:none;border-top:1px solid var(--line);background:var(--bg2);padding:6px 10px;display:flex;flex-wrap:wrap;gap:4px 16px;align-items:center;justify-content:center;font-size:.76rem;color:var(--mut);text-align:center}
.soc{display:flex;gap:6px}
.soc a{width:34px;height:34px;display:grid;place-items:center;border:1px solid var(--line);border-radius:10px;color:var(--pink);background:var(--card)}
.soc a:hover{background:var(--pink);color:var(--onp)}
.soc svg{width:18px;height:18px}
#btnTop{position:absolute;right:12px;bottom:12px;width:44px;height:44px;border-radius:50%;border:0;background:var(--pink);color:var(--onp);cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.3);display:grid;place-items:center;z-index:20}
#btnTop svg{width:22px;height:22px}
#toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);background:var(--pink);color:var(--onp);padding:10px 16px;border-radius:12px;z-index:200;max-width:92vw;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.35)}
@media (max-width:700px){
 table.t.stack thead{display:none}
 table.t.stack,.t.stack tbody{display:block}
 .t.stack tr{display:block;margin-bottom:8px;padding:6px;border:1px solid var(--line);border-radius:12px}
 .t.stack td{display:flex;justify-content:space-between;gap:10px;border:0;padding:4px 6px;text-align:right}
 .t.stack td::before{content:attr(data-label);font-weight:700;color:var(--mut);text-align:left}
 .t.stack td.ac{justify-content:flex-end;flex-wrap:wrap}.t.stack td.ac::before{display:none}
 .tools input{width:100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
/* ===== layout v2 ===== */
:root{--g1:#d6106f;--g2:#ec3a8f}
:root[data-theme=dark]{--g1:#ff4fa3;--g2:#ff7ab8}
#view{max-width:1200px;margin:0 auto}
#login{background:radial-gradient(circle at 12% 18%,rgba(255,79,163,.30),transparent 45%),radial-gradient(circle at 88% 82%,rgba(214,16,111,.24),transparent 45%),var(--bg2)}
.lc{border:0;border-radius:24px;box-shadow:0 20px 55px rgba(214,16,111,.25)}
.lc svg.logo{width:clamp(48px,9vh,68px);height:clamp(48px,9vh,68px);padding:11px;border-radius:50%;background:linear-gradient(135deg,var(--g2),var(--g1));color:#fff;margin-bottom:2px}
:root[data-theme=dark] .lc svg.logo{color:#1a0912}
.lc h1{letter-spacing:.5px}
header.top{background:linear-gradient(90deg,var(--g1),var(--g2));border-bottom:0;box-shadow:0 2px 10px rgba(0,0,0,.18);color:#fff}
header.top h1{color:#fff}
:root[data-theme=dark] header.top{background:linear-gradient(90deg,#1d1d1d,#2b1822);border-bottom:2px solid var(--pink)}
:root[data-theme=dark] header.top h1{color:var(--pink)}
header.top .ib{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.45);color:#fff}
:root[data-theme=dark] header.top .ib{background:var(--card);border-color:var(--line);color:var(--pink)}
.btn{transition:transform .12s,filter .12s}.btn:active{transform:scale(.97)}
.btn.pri{background:linear-gradient(135deg,var(--g1),var(--g2));border-color:transparent;box-shadow:0 3px 10px rgba(214,16,111,.28)}
:root[data-theme=dark] .btn.pri{box-shadow:none}
.dh{background:linear-gradient(135deg,var(--g1),var(--g2))}
:root[data-theme=dark] .dh{background:#2b1822;color:var(--pink);border-bottom:2px solid var(--pink)}
#drawer nav button span{width:34px;height:34px;display:grid;place-items:center;border-radius:10px;background:var(--bg2);font-size:1.15rem}
#drawer nav button[aria-current=page] span{background:rgba(255,255,255,.25)}
#drawer nav button[aria-current=page]{background:linear-gradient(135deg,var(--g1),var(--g2))}
#btnSair{margin-top:8px;border-top:1px solid var(--line);border-radius:0!important}
.tw{border:1px solid var(--line);border-radius:16px;background:var(--card);box-shadow:var(--sh);overflow:auto;max-height:62vh}
table.t{border:0;border-radius:0}
.t thead th{position:sticky;top:0;z-index:1;background:var(--bg2)}
.t tbody tr:nth-child(even){background:color-mix(in srgb,var(--bg2) 55%,transparent)}
.t tbody tr:hover{background:var(--bg2)}
.sec{border-radius:18px;box-shadow:var(--sh)}
.sec .tw{border:0;box-shadow:none;max-height:none}
.sec h3::before{content:"";display:inline-block;width:5px;height:1em;background:linear-gradient(var(--g2),var(--g1));border-radius:3px;margin-right:8px;vertical-align:-2px}
.bar h2::before{content:"";display:inline-block;width:6px;height:1em;background:linear-gradient(var(--g2),var(--g1));border-radius:3px;margin-right:10px;vertical-align:-3px}
.card{border-radius:18px}
.badge{font-weight:700}
.st-Pendente{background:#fff4d6;color:#7a4e00;border-color:#f0c76a}
.st-Entregue{background:#dff7e8;color:#0a6a35;border-color:#8fd8ac}
.st-Cancelada{background:#fde4e2;color:#a3211a;border-color:#f0a8a3}
:root[data-theme=dark] .st-Pendente{background:transparent;color:#ffd166;border-color:#ffd166}
:root[data-theme=dark] .st-Entregue{background:transparent;color:#5fd68f;border-color:#5fd68f}
:root[data-theme=dark] .st-Cancelada{background:transparent;color:#ff8a80;border-color:#ff8a80}
.empty{padding:34px 16px}.empty::before{content:"🍰";display:block;font-size:2rem;margin-bottom:6px}
.frm h2{padding-bottom:10px;border-bottom:2px solid var(--line);margin-bottom:14px}
dialog{border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.hero{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:18px;border-radius:20px;background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;margin-bottom:12px;box-shadow:var(--sh)}
.hero h2{font-size:1.5rem}.hero p{margin:4px 0 0;opacity:.95;text-transform:capitalize}
.hero .btn.pri{background:#fff;color:#b00c5c;box-shadow:none}
:root[data-theme=dark] .hero{background:linear-gradient(135deg,#2b1822,#1f1f1f);color:var(--txt);border:1px solid var(--pink)}
:root[data-theme=dark] .hero .btn.pri{background:var(--pink);color:var(--onp)}
.kpi .card{display:flex;gap:12px;align-items:center}
.kpi .ico{flex:none;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--bg2);font-size:1.4rem}
.kpi small{display:block;color:var(--mut);font-size:.75rem}
.quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:12px 0}
.quick button{min-height:76px;display:flex;flex-direction:column;gap:4px;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--txt);font:600 .9rem inherit;cursor:pointer;box-shadow:var(--sh)}
.quick button span{font-size:1.5rem}
.quick button:hover{border-color:var(--pink);color:var(--pink)}
/* ===== responsividade total ===== */
html,body{max-width:100%;overflow-x:hidden}
body{padding-top:env(safe-area-inset-top);padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
#btnTema{top:calc(10px + env(safe-area-inset-top));right:calc(10px + env(safe-area-inset-right))}
footer.foot{padding-bottom:max(6px,env(safe-area-inset-bottom))}
#login{display:flex;overflow-y:auto;overflow-x:hidden}
.lc{margin:auto}
#main{overflow-x:hidden;min-width:0}
#view,.card,.fld,.grid>*,.inl>*{min-width:0}
input,select,textarea{font-size:max(16px,1rem);max-width:100%}
header.top h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
td,th{overflow-wrap:anywhere}
.t td.ac{white-space:normal}
@media (min-width:1400px){html{font-size:17px}}
@media (max-width:900px){
 .tw{max-height:none;overflow:visible;border:0;box-shadow:none;background:transparent}
 .sec .tw{overflow:visible}
 table.t.stack{border:0;background:transparent}
 table.t.stack thead{display:none}
 table.t.stack,.t.stack tbody{display:block}
 .t.stack tr{display:block;margin-bottom:10px;padding:8px;border:1px solid var(--line);border-radius:14px;background:var(--card)!important;box-shadow:var(--sh)}
 .t.stack td{display:flex;justify-content:space-between;align-items:center;gap:12px;border:0;padding:5px 6px;text-align:right}
 .t.stack td::before{content:attr(data-label);font-weight:700;color:var(--mut);text-align:left;flex:none}
 .t.stack td.ac{justify-content:flex-end;flex-wrap:wrap}.t.stack td.ac::before{display:none}
 .tools{width:100%}.tools input{width:100%;flex:1 1 100%}
}
@media (max-width:600px){
 #main{padding:10px}
 .bar{gap:8px}.bar>.btn{width:100%}
 .tools .btn{flex:1 1 auto}
 .btn.sm{min-height:40px;padding:0 12px}
 .hero{padding:14px}.hero h2{font-size:1.25rem}.hero .btn{width:100%}
 .cards{grid-template-columns:1fr 1fr}
 .kpi .card{flex-direction:column;align-items:flex-start;gap:6px}
 .card b{font-size:1.05rem}
 .grid{grid-template-columns:1fr}
 dialog{width:100vw;max-width:100vw;max-height:94vh;max-height:94dvh;margin:auto 0 0;border-radius:20px 20px 0 0}
 .frm{padding:14px 14px 0}
 .acts{position:sticky;bottom:0;background:var(--card);padding:10px 0 max(10px,env(safe-area-inset-bottom));margin-top:10px}
 .acts .btn{flex:1}
 .resumo{grid-template-columns:1fr 1fr}
 .inl .fld,.inl .fld[style]{max-width:none!important;flex:1 1 100%}
 .inl .btn{width:100%}
 footer.foot{gap:4px 10px;font-size:.7rem}
 #toast{bottom:90px}
}
@media (min-width:601px) and (max-width:900px){
 .t.stack tbody{display:grid!important;grid-template-columns:1fr 1fr;gap:10px}
 .t.stack tr{margin-bottom:0!important}
}
@media (max-width:600px){
 #ff.grid{grid-template-columns:1fr 1fr;gap:8px}
 #ff .fld:nth-child(3),#ff .fld:last-child{grid-column:1/-1}
}
.hero p{text-transform:none}.hero p::first-letter{text-transform:uppercase}
@media (max-width:360px){
 html{font-size:15px}
 .cards{grid-template-columns:1fr}
 .quick{grid-template-columns:1fr 1fr}
}
@media (max-height:520px) and (orientation:landscape){
 header.top{height:46px}
 #main{padding:8px 12px}
 .lc{padding:10px}.lc h1{font-size:1.1rem}
 .lc .fld{margin-bottom:5px}.lc input{min-height:38px}.lc .btn{min-height:40px}
 .err{margin:0}
 footer.foot{padding-top:3px;padding-bottom:3px}
 .soc a{width:28px;height:28px}
}
/* ===== dashboard ===== */
:root{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--s7:#6250d6;--s8:#e34948}
:root[data-theme=dark]{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#0ca30c;--s7:#9085e9;--s8:#e66767}
.dk{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr));gap:10px;margin:6px 0 12px}
.dk .card b{font-size:1.35rem;font-variant-numeric:tabular-nums}
.dl{display:block;font-size:.76rem;margin-top:3px;font-weight:600}
.dl.up{color:var(--ok)}.dl.dn{color:var(--bad)}.dl.nu{color:var(--mut);font-weight:400}
.dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:12px}
.dc{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--sh);min-width:0}
.dc.wide{grid-column:1/-1}
.dc h3{font-size:1rem;margin:0;color:var(--txt)}
.dc .sub{color:var(--mut);font-size:.8rem;margin:2px 0 10px}
.lgd{display:flex;gap:16px;flex-wrap:wrap;font-size:.82rem;margin-bottom:6px}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.sw.ln{height:0;width:20px;border-top:3px solid;border-radius:0;vertical-align:4px}
.sw.ln.ds{border-top-style:dashed}
.chart svg{display:block;width:100%;height:auto}
.dk .card b span{font-size:inherit;color:inherit}
.dk .card b .pos{color:var(--ok)}.dk .card b .neg{color:var(--bad)}
.dform{grid-template-columns:repeat(auto-fill,minmax(180px,260px))!important}
@media (max-width:600px){.dform{grid-template-columns:1fr 1fr!important}.dform .fld:first-child{grid-column:1/-1}}
.hb{list-style:none;margin:0;padding:0;display:grid;gap:9px}
.hb li{display:grid;grid-template-columns:minmax(90px,40%) 1fr auto;gap:8px;align-items:center;font-size:.85rem}
.hb .hl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ht{display:block;height:14px}
.ht i{display:block;height:100%;border-radius:0 5px 5px 0}
.hb b{font-variant-numeric:tabular-nums;font-size:.82rem;text-align:right}
.vb{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end}
.vc{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.72rem;min-width:0}
.vc b{font-size:.72rem;font-variant-numeric:tabular-nums}
.vt{position:relative;display:block;width:100%;height:150px}
.vt i{position:absolute;left:16%;right:16%;bottom:0;background:var(--pink);border-radius:5px 5px 0 0}
.vc small{color:var(--mut)}
.sg{display:flex;gap:2px;height:28px;border-radius:7px;overflow:hidden}
.sg i{display:block;min-width:3px}
.lg{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:6px;font-size:.85rem}
.ins{list-style:none;margin:0;padding:0;display:grid;gap:10px;font-size:.9rem}
.dtip{position:fixed;z-index:300;pointer-events:none;background:var(--card);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:.8rem;box-shadow:0 6px 20px rgba(0,0,0,.28);max-width:250px;line-height:1.35}
details.dd{margin-top:12px}
details.dd summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-weight:700;color:var(--pink)}
details.dd h4{margin:12px 0 4px;color:var(--mut)}
/* ===== contas a receber ===== */
#btnMenu{position:relative}
.dot{position:absolute;top:4px;right:4px;width:12px;height:12px;border-radius:50%;background:#ffd23f;border:2px solid #d6106f}
.bdg{margin-left:auto;min-width:22px;height:22px;padding:0 6px;border-radius:99px;background:var(--bad);color:#fff;font:700 .75rem/22px system-ui,sans-serif;text-align:center;font-style:normal}
:root[data-theme=dark] .bdg{color:#1a0912}
.alerta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 14px;border-radius:14px;border:1px solid var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--card));margin-bottom:10px;font-size:.92rem}
.alerta.info{border-color:var(--pink);background:var(--bg2)}
.alerta .btn{margin-left:auto}
</style>
</head>
<body>
<a class="skip" href="#main">Pular para o conteúdo</a>
<button id="btnTema" type="button" aria-label="Alternar entre tema claro e escuro" title="Tema"></button>

<div id="stage">
  <!-- LOGIN -->
  <section id="login" aria-label="Acesso ao sistema">
    <div class="lc">
      <svg class="logo" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 30c0-10 8-18 18-18s18 8 18 18"/><path d="M10 30h44l-5 22a4 4 0 0 1-4 3H19a4 4 0 0 1-4-3z"/><path d="M24 36v14M32 36v14M40 36v14"/><circle cx="32" cy="8" r="3" fill="currentColor"/></svg>
      <h1 id="lojaLogin">Doceria</h1>
      <p id="loginMsg">Entre com seu usuário e senha</p>
      <form id="formLogin" autocomplete="on" novalidate>
        <div class="fld"><label for="lu">Usuário</label><input id="lu" name="u" autocomplete="username" required></div>
        <div class="fld"><label for="lp">Senha</label><input id="lp" name="p" type="password" autocomplete="current-password" required></div>
        <div class="fld" id="wConf" hidden><label for="lp2">Repita a senha</label><input id="lp2" name="p2" type="password" autocomplete="new-password"></div>
        <p class="err" id="lerr" role="alert"></p>
        <button class="btn pri" type="submit" id="lbtn">Entrar</button>
      </form>
    </div>
  </section>

  <!-- APP -->
  <div id="app" hidden>
    <header class="top">
      <button class="ib" id="btnMenu" type="button" aria-label="Abrir menu" aria-expanded="false" aria-controls="drawer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg><i class="dot" id="dotMenu" hidden></i></button>
      <h1 id="titulo">Vendas</h1>
    </header>
    <main id="main" tabindex="-1"><section id="view" aria-live="polite"></section></main>
  </div>
  <button id="btnTop" type="button" aria-label="Voltar ao topo" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
</div>

<div id="scrim" hidden></div>
<aside id="drawer" aria-label="Menu principal" inert>
  <div class="dh"><div><b id="lojaMenu">Doceria</b><small id="userMenu"></small></div><button type="button" id="btnFechar" aria-label="Fechar menu">✕</button></div>
  <nav id="nav"></nav>
</aside>

<footer class="foot">
  <div class="soc" aria-label="Redes sociais">
    <a id="sIg" target="_blank" rel="noopener" aria-label="Instagram" title="Instagram"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor"/></svg></a>
    <a id="sWa" target="_blank" rel="noopener" aria-label="WhatsApp" title="WhatsApp"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3 21l1.6-4.6A9 9 0 1 1 8 19.6z"/><path d="M9 8.5c0 3 3.5 6.5 6.5 6.5l1-1.5-2-1-1 .7c-1-.4-2-1.4-2.4-2.4l.7-1-1-2z" fill="currentColor" stroke="none"/></svg></a>
    <a id="sFb" target="_blank" rel="noopener" aria-label="Facebook" title="Facebook"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M14 8h3V4h-3a4 4 0 0 0-4 4v3H7v4h3v6h4v-6h3l1-4h-4V8z"/></svg></a>
  </div>
  <div>Desenvolvedor: <b>CLEILTON NASCIMENTO</b> &middot; Direitos reservados ao mesmo</div>
</footer>

<dialog id="dlg" aria-labelledby="dlgT"></dialog>
<dialog id="dlgAsk" style="width:min(420px,94vw)"></dialog>
<div id="toast" role="status" aria-live="polite" hidden></div>
<input type="file" id="fileRest" accept=".json,application/json" hidden>

<script>
'use strict';
/* ===== utilidades ===== */
const $=(s,e=document)=>e.querySelector(s), $$=(s,e=document)=>[...e.querySelectorAll(s)];
const K='doceria_dados_v1',KU='doceria_users_v1',KB='doceria_backups_v1',KT='doceria_tema',KS='doceria_sessao',KF='doceria_fonte';
const brl=v=>(+v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=parseFloat(String(v).replace(',','.'));return isNaN(n)?0:n};
const hoje=()=>new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);
const fd=d=>d?d.split('-').reverse().join('/'):'';
const fdt=t=>new Date(t).toLocaleString('pt-BR');
const nped=v=>String(v.num||0).padStart(4,'0');
const lsGet=(k,d)=>{try{const x=localStorage.getItem(k);return x?JSON.parse(x):d}catch{return d}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,typeof v==='string'?v:JSON.stringify(v));return true}catch{return false}};
const defDados=()=>({itens:[],produtos:[],equipe:[],clientes:[],vendas:[],config:{loja:'Doceria',whats:'',insta:'',face:'',seq:0}});
let S=Object.assign(defDados(),lsGet(K,{}));S.config=Object.assign(defDados().config,S.config||{});
const save=()=>{if(!lsSet(K,S))toast('Atenção: não foi possível salvar no navegador.')};
let toastT;
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,3500)}

/* ===== tema e fonte ===== */
const ICO_LUA='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 13A9 9 0 1 1 11 3a7 7 0 0 0 10 10z"/></svg>';
const ICO_SOL='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
function setTema(t){document.documentElement.dataset.theme=t;lsSet(KT,t);const b=$('#btnTema');b.innerHTML=t==='dark'?ICO_SOL:ICO_LUA;b.setAttribute('aria-pressed',t==='dark');b.title=t==='dark'?'Mudar para tema claro':'Mudar para tema escuro'}
setTema(lsGet(KT,matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'));
$('#btnTema').onclick=()=>setTema(document.documentElement.dataset.theme==='dark'?'light':'dark');
function setFonte(p){p=Math.min(24,Math.max(14,p));document.documentElement.style.fontSize=p+'px';lsSet(KF,p)}
setFonte(lsGet(KF,16));

/* ===== diálogos ===== */
function ask(msg,btns){return new Promise(res=>{const d=$('#dlgAsk');d.innerHTML=`<form method="dialog" class="frm"><p id="askMsg" style="margin:0 0 4px;font-size:1.05rem">${msg}</p><div class="acts">${btns.map((b,i)=>`<button class="btn ${b.c||''}" value="${i}">${b.t}</button>`).join('')}</div></form>`;d.setAttribute('aria-labelledby','askMsg');d.returnValue='';d.onclose=()=>res(d.returnValue===''?null:+d.returnValue);d.showModal();$('button',d).focus()})}
function abrirForm(titulo,html,onSave,pos,okTxt){const d=$('#dlg');d.innerHTML=`<form class="frm" id="frm" novalidate><h2 id="dlgT">${titulo}</h2>${html}<div class="acts"><button type="button" class="btn" id="fCancel">Cancelar</button><button type="submit" class="btn pri">${okTxt||'Salvar'}</button></div></form>`;
 const f=$('#frm');$('#fCancel').onclick=()=>d.close();
 f.onsubmit=e=>{e.preventDefault();if(!f.checkValidity()){f.reportValidity();return}if(onSave(f)!==false)d.close()};
 d.showModal();pos&&pos(f);const first=$('input,select,textarea',f);first&&first.focus()}
function campo(f,v){const id='f_'+f.k,val=v??'',r=f.req?'required':'';let i;
 if(f.t==='select')i=`<select id="${id}" name="${f.k}" ${r}><option value="">${f.req?'Selecione':''}</option>${f.o.map(o=>`<option ${o==val?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
 else if(f.t==='textarea')i=`<textarea id="${id}" name="${f.k}">${esc(val)}</textarea>`;
 else i=`<input id="${id}" name="${f.k}" type="${f.t||'text'}" ${f.t==='number'?'min="0" step="'+(f.step||'0.01')+'"':''} ${f.ph?`placeholder="${esc(f.ph)}"`:''} ${f.max?`maxlength="${f.max}"`:''} value="${esc(val)}" ${r}>`;
 return `<div class="fld ${f.w||''}"><label for="${id}">${f.l}${f.req?' <span aria-hidden="true">*</span>':''}</label>${i}</div>`}
function lerForm(form,campos){const o={};campos.forEach(f=>{const v=form.elements[f.k].value;o[f.k]=f.t==='number'?num(v):v.trim()});return o}

/* ===== cálculos ===== */
const CAT_MAT=['Ingrediente','Embalagem'];
const custoUn=i=>i.qtd>0?i.preco/i.qtd:0;
function calcProd(p){let c=0,d=0;(p.comp||[]).forEach(x=>{const it=S.itens.find(i=>i.id===x.item);if(!it)return;const v=x.qtd*custoUn(it);CAT_MAT.includes(it.cat)?c+=v:d+=v});d+=+p.despUn||0;return{c,d,tot:c+d,sug:(c+d)*(1+(+p.margem||0)/100),luc:(+p.preco||0)-c-d}}
function calcV(v){let sub=0,c=0,d=0;(v.itens||[]).forEach(i=>{sub+=i.qtd*i.preco;c+=i.qtd*(i.c||0);d+=i.qtd*(i.d||0)});const taxa=+v.taxa||0,total=sub+taxa,troco=v.pag==='Dinheiro'&&v.cond!=='A prazo'&&v.trocoPara>total?v.trocoPara-total:0;return{sub,c,d,taxa,total,troco,luc:sub-c-d}}
const prodNome=p=>`${p.desc} - ${p.sabor}`;
const addr=c=>c?[`${c.rua||''}${c.num?', '+c.num:''}${c.compl?' - '+c.compl:''}`,c.bairro,`${c.cidade||''}${c.uf?'/'+c.uf:''}`,c.cep?'CEP '+c.cep:''].filter(x=>x&&x.trim()).join(' - ')+(c.ref?' (Ref.: '+c.ref+')':''):'';
const nomeDe=(lista,id,snap)=>(S[lista].find(x=>x.id===id)||{}).nome||snap||'-';

/* ===== cadastros genéricos ===== */
const UFS=['AC','AL','AP','AM','BA','CE','DF','ES','GO','MA','MT','MS','MG','PA','PB','PR','PE','PI','RJ','RN','RS','RO','RR','SC','SP','SE','TO'];
const ENT={
 itens:{titulo:'Itens de custo',sing:'item',campos:[
  {k:'nome',l:'Nome do item',req:1,ph:'Ex.: Leite condensado 395 g'},
  {k:'cat',l:'Categoria',t:'select',req:1,o:['Ingrediente','Embalagem','Despesa fixa','Despesa variável','Mão de obra']},
  {k:'un',l:'Unidade',t:'select',req:1,o:['un','kg','g','L','mL','cx','h','mês']},
  {k:'qtd',l:'Quantidade na compra',t:'number',req:1,step:'0.001',ph:'Ex.: 1'},
  {k:'preco',l:'Preço pago (R$)',t:'number',req:1},
  {k:'forn',l:'Fornecedor',ph:'Opcional'}],
  cols:[['Nome',r=>esc(r.nome)],['Categoria',r=>esc(r.cat)],['Unid.',r=>esc(r.un)],['Qtd. compra',r=>r.qtd],['Preço',r=>brl(r.preco)],['Custo unit.',r=>brl(custoUn(r))],['Fornecedor',r=>esc(r.forn)]]},
 produtos:{titulo:'Produtos',sing:'produto',campos:[
  {k:'desc',l:'Descrição do produto',req:1,ph:'Ex.: Brigadeiro gourmet'},
  {k:'sabor',l:'Sabor',req:1,ph:'Ex.: Chocolate belga'},
  {k:'genero',l:'Gênero',t:'select',req:1,o:['Doce','Sobremesa']},
  {k:'emb',l:'Embalagem',req:1,ph:'Ex.: Caixa, pote, saquinho'},
  {k:'peso',l:'Peso',req:1,ph:'Ex.: 200 g'},
  {k:'margem',l:'Margem de lucro desejada (%)',t:'number'},
  {k:'despUn',l:'Outras despesas por unidade (R$)',t:'number'},
  {k:'preco',l:'Preço de venda (R$)',t:'number',req:1}],
  cols:[['Produto',r=>esc(r.desc)],['Sabor',r=>esc(r.sabor)],['Gênero',r=>esc(r.genero)],['Embalagem / Peso',r=>esc(r.emb+' / '+r.peso)],['Custo + desp.',r=>brl(calcProd(r).tot)],['Preço',r=>brl(r.preco)],['Lucro/un.',r=>{const l=calcProd(r).luc;return `<span class="${l>=0?'pos':'neg'}">${brl(l)}</span>`}]]},
 equipe:{titulo:'Fabricação e vendedores',sing:'cadastro',campos:[
  {k:'nome',l:'Nome completo',req:1},
  {k:'tipo',l:'Função',t:'select',req:1,o:['Responsável pela fabricação','Vendedor']},
  {k:'tel',l:'Telefone / WhatsApp',t:'tel',ph:'(00) 00000-0000'},
  {k:'com',l:'Comissão (%) - vendedores',t:'number',step:'0.1'},
  {k:'obs',l:'Observações',t:'textarea',w:'full'}],
  cols:[['Nome',r=>esc(r.nome)],['Função',r=>esc(r.tipo)],['Telefone',r=>esc(r.tel)],['Comissão',r=>r.tipo==='Vendedor'?(+r.com||0)+'%':'-']]},
 clientes:{titulo:'Clientes',sing:'cliente',campos:[
  {k:'nome',l:'Nome do cliente',req:1},
  {k:'tel',l:'Telefone / WhatsApp',t:'tel',req:1,ph:'(00) 00000-0000'},
  {k:'cep',l:'CEP',ph:'00000-000',max:9},
  {k:'rua',l:'Rua / Avenida',req:1},
  {k:'num',l:'Número',req:1},
  {k:'compl',l:'Complemento'},
  {k:'bairro',l:'Bairro',req:1},
  {k:'cidade',l:'Cidade',req:1},
  {k:'uf',l:'UF',t:'select',req:1,o:UFS},
  {k:'ref',l:'Ponto de referência',w:'full'}],
  cols:[['Nome',r=>esc(r.nome)],['Telefone',r=>esc(r.tel)],['Endereço de entrega',r=>esc(addr(r))]]}
};
function formGen(key,id){const E=ENT[key],r=id?S[key].find(x=>x.id===id):{};
 abrirForm((id?'Editar ':'Novo ')+E.sing,`<div class="grid">${E.campos.map(f=>campo(f,r[f.k])).join('')}</div>`,f=>{const d=lerForm(f,E.campos);if(id)Object.assign(r,d);else{d.id=uid();S[key].push(d)}save();render();toast('Salvo com sucesso');return true},
 f=>{if(key==='clientes'){const c=f.elements.cep;c.addEventListener('blur',async()=>{const v=c.value.replace(/\D/g,'');if(v.length!==8)return;try{const j=await (await fetch(`https://viacep.com.br/ws/${v}/json/`)).json();if(j.erro)return;const s=(k,x)=>{if(!f.elements[k].value)f.elements[k].value=x};s('rua',j.logradouro);s('bairro',j.bairro);s('cidade',j.localidade);s('uf',j.uf)}catch{}})}})}
function tbl(cols,rows,acts){return `<table class="t stack"><thead><tr>${cols.map(c=>`<th scope="col">${c[0]}</th>`).join('')}${acts?'<th scope="col">Ações</th>':''}</tr></thead><tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td data-label="${c[0]}">${c[1](r)}</td>`).join('')}${acts?`<td class="ac">${(typeof acts==='function'?acts(r):acts).map(a=>`<button class="btn sm ${a[2]||''}" data-act="${a[0]}" data-id="${r.id}">${a[1]}</button>`).join('')}</td>`:''}</tr>`).join('')}</tbody></table>`}

let cur='inicio',acts={};
const ui={q:{},vf:{ini:'',fim:'',st:'',pag:'',cond:'',cli:''},rel:{ini:'',fim:'',vend:'',pag:'',cond:''}};
function lista(key){const E=ENT[key];
 view.innerHTML=`<div class="bar"><h2>${E.titulo}</h2><div class="tools"><input type="search" id="q" aria-label="Buscar em ${E.titulo}" placeholder="Buscar..." value="${esc(ui.q[key]||'')}"><button class="btn pri" data-act="novo">+ Novo</button></div></div><div id="lista" class="tw"></div>`;
 const pinta=()=>{const q=(ui.q[key]||'').toLowerCase();const rows=S[key].filter(r=>!q||JSON.stringify(Object.values(r)).toLowerCase().includes(q));$('#lista').innerHTML=rows.length?tbl(E.cols,rows,[['edit','Editar'],['del','Excluir','dan']]):`<div class="empty">Nenhum registro encontrado. Toque em “+ Novo” para cadastrar.</div>`};
 pinta();$('#q').oninput=e=>{ui.q[key]=e.target.value;pinta()};
 acts={novo:()=>key==='produtos'?formProd():formGen(key),edit:id=>key==='produtos'?formProd(id):formGen(key,id),del:async id=>{const r=S[key].find(x=>x.id===id);if(await ask(`Excluir “${esc(r.nome||r.desc)}”?`,[{t:'Cancelar'},{t:'Excluir',c:'dan'}])===1){S[key]=S[key].filter(x=>x.id!==id);save();pinta();toast('Excluído')}}}}

/* ===== produto ===== */
function formProd(id){const E=ENT.produtos,r=id?JSON.parse(JSON.stringify(S.produtos.find(x=>x.id===id))):{comp:[],margem:50,despUn:0,preco:0};
 if(!S.itens.length)toast('Dica: cadastre antes os “Itens de custo” para calcular custo e lucro do produto.');
 const html=`<div class="grid">${E.campos.map(f=>campo(f,r[f.k])).join('')}</div>
 <div class="sec"><h3>Composição (itens usados em 1 unidade)</h3>
  <div class="inl"><div class="fld"><label for="cSel">Item</label><select id="cSel"><option value="">Selecione</option>${S.itens.map(i=>`<option value="${i.id}">${esc(i.nome)} (${esc(i.un)} · ${esc(i.cat)})</option>`).join('')}</select></div>
  <div class="fld" style="max-width:130px"><label for="cQtd">Quantidade</label><input id="cQtd" type="number" min="0" step="0.001" value="1"></div><button type="button" class="btn" id="cAdd">Adicionar</button></div>
  <div id="cList" class="tw"></div></div>
 <div class="resumo" id="res" aria-live="polite"></div>
 <div style="margin-top:8px"><button type="button" class="btn sm" id="usaSug">Usar preço sugerido</button></div>`;
 abrirForm(id?'Editar produto':'Novo produto',html,f=>{const d=lerForm(f,E.campos);d.comp=r.comp;if(id)Object.assign(S.produtos.find(x=>x.id===id),d);else{d.id=uid();S.produtos.push(d)}save();render();toast('Produto salvo');return true},f=>{
  const get=()=>({comp:r.comp,margem:f.elements.margem.value,despUn:f.elements.despUn.value,preco:f.elements.preco.value});
  const rec=()=>{$('#cList').innerHTML=r.comp.length?`<table class="t stack"><thead><tr><th>Item</th><th>Qtd.</th><th>Custo</th><th></th></tr></thead><tbody>${r.comp.map((x,i)=>{const it=S.itens.find(q=>q.id===x.item);return `<tr><td data-label="Item">${esc(it?it.nome:'(item removido)')}</td><td data-label="Qtd.">${x.qtd} ${it?esc(it.un):''}</td><td data-label="Custo">${brl(it?x.qtd*custoUn(it):0)}</td><td class="ac"><button type="button" class="btn sm dan" data-rm="${i}" aria-label="Remover item">✕</button></td></tr>`}).join('')}</tbody></table>`:'<div class="empty">Nenhum item na composição.</div>';
   const c=calcProd(get());$('#res').innerHTML=`<div><span>Materiais</span><b>${brl(c.c)}</b></div><div><span>Despesas</span><b>${brl(c.d)}</b></div><div><span>Custo total</span><b>${brl(c.tot)}</b></div><div><span>Preço sugerido</span><b>${brl(c.sug)}</b></div><div><span>Lucro por unidade</span><b class="${c.luc>=0?'pos':'neg'}">${brl(c.luc)}</b></div>`};
  $('#cAdd').onclick=()=>{const it=$('#cSel').value,q=num($('#cQtd').value);if(!it||q<=0){toast('Escolha o item e a quantidade.');return}const ex=r.comp.find(x=>x.item===it);ex?ex.qtd+=q:r.comp.push({item:it,qtd:q});rec()};
  $('#cList').onclick=e=>{const b=e.target.closest('[data-rm]');if(b){r.comp.splice(+b.dataset.rm,1);rec()}};
  ['margem','despUn','preco'].forEach(k=>f.elements[k].addEventListener('input',rec));

const MENU=[['inicio','🏠','Início'],['dashboard','📈','Dashboard'],['vendas','🛒','Vendas'],['receber','💵','Contas a receber'],['produtos','🍰','Produtos'],['itens','🧾','Itens de custo'],['equipe','👩‍🍳','Fabricação e vendedores'],['clientes','👥','Clientes'],['relatorio','📊','Relatórios'],['backup','💾','Backup e ajustes']];
const view=$('#view');
const VIEWS={inicio,dashboard,vendas,receber,produtos:()=>lista('produtos'),itens:()=>lista('itens'),equipe:()=>lista('equipe'),clientes:()=>lista('clientes'),relatorio,backup};
$('#nav').innerHTML=MENU.map(m=>`<button type="button" data-go="${m[0]}"><span aria-hidden="true">${m[1]}</span>${m[2]}${m[0]==='receber'?'<em class="bdg" id="bdgCR" hidden></em>':''}</button>`).join('')+`<button type="button" id="btnSair"><span aria-hidden="true">🚪</span>Sair do sistema</button>`;
function render(){VIEWS[cur]();atualizaBadge();$$('#nav [data-go]').forEach(b=>{b.dataset.go===cur?b.setAttribute('aria-current','page'):b.removeAttribute('aria-current')});$('#titulo').textContent=(MENU.find(m=>m[0]===cur)||[])[2]||''}
function go(n){cur=n;fechaMenu();render();$('#main').scrollTop=0;$('#btnTop').hidden=true}
view.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b&&acts[b.dataset.act])acts[b.dataset.act](b.dataset.id,b)});
view.addEventListener('submit',e=>{e.preventDefault();const f=e.target;
 if(f.id==='fCfg'){const o=Object.fromEntries(new FormData(f));Object.assign(S.config,{loja:o.loja.trim()||'Doceria',whats:o.whats.trim(),insta:o.insta.trim(),face:o.face.trim()});save();atualizaMarca();toast('Dados salvos')}
 if(f.id==='fSenha'){const o=Object.fromEntries(new FormData(f));(async()=>{const us=lsGet(KU,[]),u=us.find(x=>x.u===sessionStorage.getItem(KS));if(!u||u.h!==await sha(o.a)){toast('Senha atual incorreta.');return}u.h=await sha(o.n);lsSet(KU,us);f.reset();toast('Senha alterada com sucesso.')})()}});
$('#nav').addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b)go(b.dataset.go)});
$('#btnSair').onclick=sair;
function abreMenu(){$('#drawer').classList.add('open');$('#drawer').inert=false;$('#scrim').hidden=false;$('#btnMenu').setAttribute('aria-expanded','true');$('#nav button').focus()}
function fechaMenu(){if(!$('#drawer').classList.contains('open'))return;$('#drawer').classList.remove('open');$('#drawer').inert=true;$('#scrim').hidden=true;$('#btnMenu').setAttribute('aria-expanded','false');$('#btnMenu').focus()}
$('#btnMenu').onclick=abreMenu;$('#btnFechar').onclick=fechaMenu;$('#scrim').onclick=fechaMenu;
document.addEventListener('keydown',e=>{if(e.key==='Escape')fechaMenu()});
const mainEl=$('#main');mainEl.addEventListener('scroll',()=>{$('#btnTop').hidden=mainEl.scrollTop<200||$('#app').hidden});
$('#btnTop').onclick=()=>{mainEl.scrollTo({top:0});$('#btnMenu').focus()};

/* ===== rodapé / marca ===== */
function atualizaMarca(){const c=S.config;$('#lojaLogin').textContent=c.loja;$('#lojaMenu').textContent=c.loja;document.title=c.loja+' - Vendas de Doces e Sobremesas';
 const link=(v,base)=>!v?base:/^https?:/i.test(v)?v:base+v.replace(/^@/,'');
 $('#sIg').href=link(c.insta,'https://www.instagram.com/');$('#sFb').href=link(c.face,'https://www.facebook.com/');
 const w=c.whats.replace(/\D/g,'');$('#sWa').href=w?`https://wa.me/${w.length<=11?'55'+w:w}`:'https://wa.com/'.replace('wa.com','web.whatsapp.com')}
atualizaMarca();

/* ===== login / sessão ===== */
async function sha(s){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('doceria:'+s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch{let h=5381;for(const c of 'doceria:'+s)h=(h*33^c.charCodeAt(0))>>>0;return 'f'+h}}
let primeiro=!lsGet(KU,[]).length,timer=null;
function modoLogin(){primeiro=!lsGet(KU,[]).length;$('#wConf').hidden=!primeiro;$('#lp2').required=primeiro;$('#lbtn').textContent=primeiro?'Criar acesso e entrar':'Entrar';$('#loginMsg').textContent=primeiro?'Primeiro acesso: crie seu usuário e senha':'Entre com seu usuário e senha';$('#lp').autocomplete=primeiro?'new-password':'current-password'}
modoLogin();
$('#formLogin').onsubmit=async e=>{e.preventDefault();const u=$('#lu').value.trim(),p=$('#lp').value,er=$('#lerr');er.textContent='';
 if(!u||!p){er.textContent='Informe usuário e senha.';return}
 const us=lsGet(KU,[]);
 if(primeiro){if(p.length<4){er.textContent='A senha deve ter ao menos 4 caracteres.';return}if(p!==$('#lp2').value){er.textContent='As senhas não conferem.';return}us.push({u,h:await sha(p)});lsSet(KU,us)}
 else{const x=us.find(i=>i.u.toLowerCase()===u.toLowerCase());if(!x||x.h!==await sha(p)){er.textContent='Usuário ou senha incorretos.';return}}
 sessionStorage.setItem(KS,primeiro?u:us.find(i=>i.u.toLowerCase()===u.toLowerCase()).u);$('#lp').value='';$('#lp2').value='';entrar()};
function entrar(){$('#login').hidden=true;$('#app').hidden=false;$('#userMenu').textContent='Usuário: '+sessionStorage.getItem(KS);
 const b=getBk();if(!b.length||Date.now()-b[0].ts>3600000)snapshot('automático');
 clearInterval(timer);timer=setInterval(()=>{snapshot('automático');if(cur==='backup')backup()},3600000);go('inicio');const rv=resumoCR().v;if(rv.n)toast(`⚠️ ${rv.n} parcela(s) vencida(s) somando ${brl(rv.val)}`)}
async function sair(){fechaMenu();const r=await ask('Deseja realizar o backup antes de sair do sistema?',[{t:'Sim',c:'pri'},{t:'Não'}]);if(r===null)return;if(r===0){snapshot('ao sair');baixarBackup()}
 clearInterval(timer);sessionStorage.removeItem(KS);$('#app').hidden=true;$('#btnTop').hidden=true;$('#login').hidden=false;modoLogin();$('#lu').value='';$('#lu').focus()}
if(sessionStorage.getItem(KS))entrar();
</script>
</body>
</html>
